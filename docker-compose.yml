services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Allow container to reach FreeLLMAPI running on host
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://host.docker.internal:3001/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
